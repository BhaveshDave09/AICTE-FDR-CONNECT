# Render Blueprint Configuration for FDR Connect (AICTE Portal)
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: fdr-connect
    env: node
    plan: free
    region: oregon
    rootDir: FDR-Final-main
    buildCommand: npm install --include=dev --legacy-peer-deps && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
